version: "3.9"

services:
  redis:
    image: redis:7
    container_name: crypto-redis
    ports:
      - "6379:6379"

  api:
    build: ./services/api
    container_name: crypto-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  worker:
    build: ./services/worker
    container_name: crypto-worker
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis