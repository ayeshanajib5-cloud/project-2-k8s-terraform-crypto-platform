version: "3.9"

services:

  redis:
    image: redis:7
    container_name: crypto-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: crypto-postgres
    environment:
      POSTGRES_DB: cryptodb
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_pass
    ports:
      - "5432:5432"

  api:
    build: ./services/api
    container_name: crypto-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - postgres

  worker:
    build: ./services/worker
    container_name: crypto-worker
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_NAME=cryptodb
      - DB_USER=crypto_user
      - DB_PASSWORD=crypto_pass
    depends_on:
      - redis
      - postgres