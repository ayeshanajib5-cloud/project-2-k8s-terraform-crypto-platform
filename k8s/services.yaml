apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: crypto-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: crypto-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: crypto-api-service
  namespace: crypto-platform
spec:
  type: NodePort
  selector:
    app: crypto-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080